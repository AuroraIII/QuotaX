<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuotaX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="widget" id="widget">
  <!-- 收起态横条：整条可拖拽（自定义拖拽逻辑见 app.js，替代 data-tauri-drag-region） -->
  <div class="bar" id="bar">
    <div class="k-dot">K</div>
    <div class="bar-rows">
      <div class="bar-row">
        <span class="label">周</span>
        <div class="track"><div class="fill" id="bar-fill-1"></div></div>
        <span class="pct" id="bar-pct-1">--</span>
      </div>
      <div class="bar-row">
        <span class="label">5h</span>
        <div class="track"><div class="fill" id="bar-fill-2"></div></div>
        <span class="pct" id="bar-pct-2">--</span>
      </div>
    </div>
  </div>

  <!-- 展开卡片 -->
  <div class="card" id="card">
    <div class="card-head">
      <span class="card-title">Kimi Code 额度</span>
      <span class="card-time" id="refresh-time">--</span>
    </div>
    <div id="error-line" class="error-line" hidden></div>
    <!-- 登录视图（needs_login：凭证缺失或 refresh 被拒时显示） -->
    <div id="login-view" class="login-view" hidden>
      <div id="login-idle">
        <div class="login-hint">未检测到可用的 Kimi Code 登录凭证</div>
        <button class="btn login-btn" id="btn-login">使用 Kimi 账号登录</button>
      </div>
      <div id="login-panel" hidden>
        <div class="login-hint">请在授权页输入以下代码完成登录</div>
        <div class="user-code" id="login-user-code">------</div>
        <div class="login-link" id="login-link">--</div>
        <div class="login-actions">
          <button class="btn" id="btn-open-auth">打开授权页</button>
          <button class="btn" id="btn-cancel-login">取消</button>
        </div>
      </div>
      <div class="login-status" id="login-status" hidden>
        <span id="login-status-text"></span>
        <span class="login-countdown" id="login-countdown"></span>
      </div>
    </div>
    <div id="rows"></div>
    <div class="extra-row" id="extra-row" hidden>
      <span>Extra Usage 余额</span>
      <span class="value" id="extra-value"></span>
    </div>
    <div class="card-foot">
      <button class="btn" id="btn-refresh">⟳ 立即刷新</button>
      <label class="top-toggle"><input type="checkbox" id="chk-top"> 置顶</label>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
