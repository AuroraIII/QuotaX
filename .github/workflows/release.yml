name: Release

# macOS 打包必须在 macOS 运行器上完成（Tauri 不支持从 Windows 交叉构建 .app/.dmg：
# ring 的 C 编译、代码签名、DMG 打包均依赖 macOS SDK / Xcode 工具链）。
# 本工作流同时产出 Windows (NSIS) 与 macOS (DMG, Apple Silicon) 两个安装包。
#
# 触发方式：
#   - 手动：GitHub → Actions → Release → Run workflow
#   - 打 tag：git tag v0.1.0 && git push origin v0.1.0
#
# Intel Mac 如需支持：将 macos 作业的 target 改为 universal-apple-darwin，
# 并 rustup target add x86_64-apple-darwin（构建时间约翻倍）。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest # Apple Silicon (aarch64)
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build --target ${{ matrix.target }}
        # 未签名包：用户首次打开需在「系统设置 → 隐私与安全性」放行，
        # 或右键 → 打开。如需免警告分发，需配置 Apple 开发者证书 + 公证（secrets）。

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: quotax-windows-x86_64
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: quotax-macos-aarch64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
