name: Release

# macOS 打包必须在 macOS 运行器上完成（Tauri 不支持从 Windows 交叉构建 .app/.dmg：
# ring 的 C 编译、代码签名、DMG 打包均依赖 macOS SDK / Xcode 工具链）。
# 本工作流同时产出 Windows (NSIS) 与 macOS (DMG, Apple Silicon) 两个安装包。
#
# 触发方式：
#   - 手动：GitHub → Actions → Release → Run workflow
#   - 打 tag：git tag v0.1.0 && git push origin v0.1.0
#
# Intel Mac 如需支持：将 macos 作业的 target 改为 universal-apple-darwin，
# 并 rustup target add x86_64-apple-darwin（构建时间约翻倍）。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest # Apple Silicon (aarch64)
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build --target ${{ matrix.target }}

      # 无 Apple 开发者证书时的可用分发方案：
      #   1. ad-hoc 深签名（aarch64 强制要求签名，--deep 确保嵌套可执行文件也签上）
      #   2. 用 ditto 打包 zip（保留 macOS 元数据/符号链接，Finder 可直接解压；
      #      tar 打包的 .app 解压后容易损坏，不再分发 .app.tar.gz）
      #   3. 用户下载后运行 xattr -cr /Applications/QuotaX.app 清除 quarantine
      #      （未公证的应用从浏览器下载会被 Gatekeeper 标记为「已损坏」）
      - name: Ad-hoc sign + ditto zip (macOS)
        if: runner.os == 'macOS'
        run: |
          # dmg 打包完成后会清理 QuotaX.app，需单独重建 .app（cargo 有缓存，秒级完成）
          npx tauri build --target ${{ matrix.target }} --bundles app
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/QuotaX.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/QuotaX_aarch64.app.zip"

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: quotax-windows-x86_64
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: quotax-macos-aarch64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.zip

  # 打 tag（v*）时，在两个平台构建完成后自动创建 GitHub Release 并附上安装包。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: QuotaX ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            quotax-windows-x86_64/*.exe
            quotax-macos-aarch64/*.dmg
            quotax-macos-aarch64/*.app.zip
